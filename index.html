<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログアプリ</title>

<style>
body { font-family: sans-serif; padding:20px; }
button { margin:5px; padding:10px; }
table { border-collapse: collapse; margin-top:20px; width:100%; }
th, td { border:1px solid #ccc; padding:8px; text-align:center; }
#map { height:300px; margin-top:20px; }
.summary { margin-top:20px; font-weight:bold; }
</style>
</head>
<body>

<h2>稼働ログ</h2>

<div id="now"></div>

<button onclick="startWork()">出勤</button>
<button onclick="startBreak()">休憩</button>
<button onclick="resumeWork()">再開</button>
<button onclick="endWork()">退勤</button>

<div class="summary">
稼働時間：<span id="workTime">0</span> 分　
休憩時間：<span id="breakTime">0</span> 分
</div>

<table>
<thead>
<tr>
<th>日付</th>
<th>時刻</th>
<th>状態</th>
<th>移動時間(分)</th>
<th>地図</th>
</tr>
</thead>
<tbody id="logTable"></tbody>
</table>

<div id="map"></div>

<script>

let status="OFF";
let logs=[];
let map;
let marker;

// 現在時刻
function updateClock(){
 const now=new Date();
 document.getElementById("now").innerText=
  now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);

// GPS
function getLocation(){
 return new Promise((resolve)=>{
  navigator.geolocation.getCurrentPosition(pos=>{
   resolve({
    lat:pos.coords.latitude,
    lng:pos.coords.longitude
   });
  });
 });
}

// ログ追加
async function addLog(){
 const loc=await getLocation();
 const time=new Date();

 logs.push({
  time:time.toISOString(),
  status,
  lat:loc.lat,
  lng:loc.lng
 });

 renderTable();
 calcSummary();
}

// ボタン
function startWork(){ status="ON"; addLog(); }
function startBreak(){ status="BREAK"; addLog(); }
function resumeWork(){ status="ON"; addLog(); }

// 退勤＋クラウド
async function endWork(){
 status="OFF";
 await addLog();

 await fetch("https://fragrant-dew-8296.info-chibafukushi.workers.dev",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body:JSON.stringify(logs)
 });

 alert("クラウド保存完了");
 logs=[];
 renderTable();
 calcSummary();
}

// 表描画
function renderTable(){
 const tbody=document.getElementById("logTable");
 tbody.innerHTML="";

 for(let i=0;i<logs.length;i++){
  const log=logs[i];
  const d=new Date(log.time);

  let moveTime=0;
  if(i>0){
   const prev=new Date(logs[i-1].time);
   moveTime=Math.floor((d-prev)/1000/60);
  }

  const row=`
   <tr>
    <td>${d.toLocaleDateString()}</td>
    <td>${d.toLocaleTimeString()}</td>
    <td>${log.status}</td>
    <td>${moveTime}</td>
    <td><button onclick="showMap(${log.lat}, ${log.lng})">表示</button></td>
   </tr>
  `;
  tbody.innerHTML+=row;
 }
}

// 集計（ここが重要）
function calcSummary(){
 let work=0;
 let rest=0;

 for(let i=1;i<logs.length;i++){
  const prev=logs[i-1];
  const now=logs[i];

  const diff=Math.floor((new Date(now.time)-new Date(prev.time))/1000/60);

  if(prev.status==="ON") work+=diff;
  if(prev.status==="BREAK") rest+=diff;
 }

 document.getElementById("workTime").innerText=work;
 document.getElementById("breakTime").innerText=rest;
}

// 地図表示（Google Mapリンク式）
function showMap(lat,lng){
 const url=`https://www.google.com/maps?q=${lat},${lng}`;
 window.open(url,"_blank");
}

</script>

</body>
</html>
