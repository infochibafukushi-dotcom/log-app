<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>タイムカード</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--main:#2563eb;--danger:#dc2626;--warn:#f59e0b;--ok:#16a34a;--text:#111827;--muted:#6b7280;--line:#e5e7eb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .wrap{max-width:760px;margin:0 auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 20px rgba(15,23,42,.06);padding:18px;margin-bottom:14px}
    h1{font-size:24px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:14px;padding:16px 12px;font-size:18px;font-weight:700;color:#fff;background:var(--main)}.btn:disabled{opacity:.45}.btn.break{background:var(--warn)}.btn.off{background:var(--danger)}.btn.resume{background:var(--ok)}
    .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:12px}.label{font-size:12px;color:var(--muted)}.value{font-size:20px;font-weight:800;margin-top:4px}.log{font-size:13px;border-top:1px solid var(--line);padding:8px 0}.row{display:flex;justify-content:space-between;gap:10px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-inner{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin-top:8px}.small{font-size:12px;color:var(--muted);line-height:1.6}.linkbtn{background:#111827;color:#fff;border:0;border-radius:12px;padding:12px 14px;font-weight:700}.map{height:220px;background:#eef2ff;border:1px dashed #93c5fd;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#1d4ed8;font-weight:700}.err{color:#dc2626;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>タイムカード</h1>
      <div class="sub" id="userLabel">従業員未設定</div>
      <div class="sub" id="nowLabel"></div>
    </div>

    <div class="card">
      <div class="grid">
        <button class="btn" id="btnOn">出勤</button>
        <button class="btn break" id="btnBreak">休憩</button>
        <button class="btn resume" id="btnResume">再開</button>
        <button class="btn off" id="btnOff">退勤</button>
      </div>
      <p class="small">退勤時に当日のログをまとめて送信します。通信できない場合は端末内に残ります。</p>
    </div>

    <div class="card">
      <h2>本日の集計</h2>
      <div class="stat">
        <div class="box"><div class="label">稼働時間</div><div class="value" id="workTime">0:00</div></div>
        <div class="box"><div class="label">休憩時間</div><div class="value" id="breakTime">0:00</div></div>
        <div class="box"><div class="label">移動距離</div><div class="value" id="distance">0.00km</div></div>
        <div class="box"><div class="label">概算売上</div><div class="value" id="fare">0円</div></div>
      </div>
    </div>

    <div class="card">
      <h2>位置情報</h2>
      <div class="map" id="mapBox">GPS取得前</div>
      <p class="small" id="gpsLabel"></p>
    </div>

    <div class="card">
      <div class="row"><h2>ログ</h2><button class="linkbtn" id="changeUser">ID変更</button></div>
      <div id="logs"></div>
    </div>
  </div>

  <div class="modal" id="userModal" style="display:none">
    <div class="modal-inner">
      <h2>従業員ID入力</h2>
      <p class="small">割り振られたIDを入力してください。</p>
      <input id="employeeId" inputmode="numeric" placeholder="例：0000" />
      <button class="btn" id="saveUser" style="margin-top:12px">確定</button>
      <div class="err" id="userError"></div>
      <p class="small">仮ID：0000　山本信勝</p>
    </div>
  </div>

<script>
const API_BASE = "https://YOUR-WORKER-DOMAIN.workers.dev";
const USERS = { "0000": { name: "山本信勝", hourlyRate: 3000, payRate: 0.6 } };
const FARE_PER_KM = 500;
const LS_LOGS = "timecard_logs_v2";
const LS_USER_ID = "timecard_user_id";
const LS_USER_NAME = "timecard_user_name";
let logs = JSON.parse(localStorage.getItem(LS_LOGS) || "[]");
let currentPosition = null;

const $ = id => document.getElementById(id);
function pad(n){return String(n).padStart(2,"0")}
function nowIso(){return new Date().toISOString()}
function fmtTime(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function fmtDur(sec){sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60); return `${h}:${pad(m)}`}
function yen(n){return Math.round(n).toLocaleString()+"円"}
function saveLogs(){localStorage.setItem(LS_LOGS, JSON.stringify(logs))}
function sessionId(){let id=sessionStorage.getItem("timecard_session_id"); if(!id){id="S"+Date.now()+"-"+Math.random().toString(16).slice(2); sessionStorage.setItem("timecard_session_id",id)} return id}
function user(){return {id:localStorage.getItem(LS_USER_ID), name:localStorage.getItem(LS_USER_NAME)}}
function showUserModal(){ $("userModal").style.display="flex" }
function hideUserModal(){ $("userModal").style.display="none" }
function ensureUser(){ const u=user(); if(!u.id || !u.name) showUserModal(); updateUserLabel(); }
function updateUserLabel(){ const u=user(); $("userLabel").textContent = u.name ? `従業員：${u.name}（ID:${u.id}）` : "従業員未設定" }
function getGps(){ return new Promise(resolve=>{ if(!navigator.geolocation) return resolve(null); navigator.geolocation.getCurrentPosition(pos=>resolve({lat:pos.coords.latitude,lng:pos.coords.longitude}),()=>resolve(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0}); }); }
function haversine(a,b){ if(!a||!b) return 0; const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180; const dLng=(b.lng-a.lng)*Math.PI/180; const la1=a.lat*Math.PI/180; const la2=b.lat*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
function lastLog(){ return logs[logs.length-1] || null }
function calc(){ let work=0, br=0, dist=0; for(let i=0;i<logs.length;i++){ const cur=logs[i], next=logs[i+1]; if(next){ const diff=(new Date(next.time)-new Date(cur.time))/1000; if(cur.status==="ON") work+=diff; if(cur.status==="BREAK") br+=diff; } if(i>0){ dist+=Number(logs[i].distance || 0); } } const u=USERS[user().id] || {hourlyRate:3000}; const fare=(work/3600)*u.hourlyRate + dist*FARE_PER_KM; $("workTime").textContent=fmtDur(work); $("breakTime").textContent=fmtDur(br); $("distance").textContent=dist.toFixed(2)+"km"; $("fare").textContent=yen(fare); return {work,br,dist,fare}; }
function render(){ updateUserLabel(); $("nowLabel").textContent="現在時刻："+fmtTime(new Date()); const html=logs.slice().reverse().map(l=>`<div class="log"><b>${statusLabel(l.status)}</b> ${new Date(l.time).toLocaleString()}<br><span class="small">${l.lat?`GPS ${Number(l.lat).toFixed(6)}, ${Number(l.lng).toFixed(6)}`:"GPSなし"} / ${l.distance?Number(l.distance).toFixed(2)+"km":"0.00km"}</span></div>`).join(""); $("logs").innerHTML=html || `<p class="small">ログなし</p>`; calc(); updateButtons(); }
function statusLabel(s){return {ON:"出勤/再開",BREAK:"休憩",OFF:"退勤"}[s]||s}
function updateButtons(){ const l=lastLog(); $("btnOn").disabled=!!l && l.status!=="OFF"; $("btnBreak").disabled=!l || l.status!=="ON"; $("btnResume").disabled=!l || l.status!=="BREAK"; $("btnOff").disabled=!l || l.status==="OFF"; }
async function punch(status){ const u=user(); if(!u.id){showUserModal();return} const gps=await getGps(); let distance=0; const prev=lastLog(); if(gps && prev && prev.lat && prev.lng) distance=haversine({lat:prev.lat,lng:prev.lng}, gps); const item={session_id:sessionId(),user_id:u.id,user_name:u.name,time:nowIso(),status,lat:gps?.lat||null,lng:gps?.lng||null,distance, fare:0, synced:false}; logs.push(item); saveLogs(); if(gps){currentPosition=gps; $("gpsLabel").textContent=`緯度:${gps.lat.toFixed(6)} 経度:${gps.lng.toFixed(6)}`; $("mapBox").textContent="GPS取得済み"} render(); if(status==="OFF") await syncLogs(); }
async function syncLogs(){ const unsynced=logs.filter(l=>!l.synced); if(!unsynced.length) return; try{ const res=await fetch(API_BASE+"/logs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({logs:unsynced})}); if(!res.ok) throw new Error("send failed"); logs=logs.map(l=>({...l,synced:true})); saveLogs(); alert("退勤しました"); }catch(e){ alert("退勤しました。通信できないため端末に保存しました。") } }
$("saveUser").onclick=()=>{ const id=$("employeeId").value.trim(); if(!USERS[id]){$("userError").textContent="登録されていないIDです";return} localStorage.setItem(LS_USER_ID,id); localStorage.setItem(LS_USER_NAME,USERS[id].name); hideUserModal(); render(); };
$("changeUser").onclick=showUserModal;
$("btnOn").onclick=()=>punch("ON"); $("btnBreak").onclick=()=>punch("BREAK"); $("btnResume").onclick=()=>punch("ON"); $("btnOff").onclick=()=>punch("OFF");
setInterval(render,1000); ensureUser(); render();
</script>
</body>
</html>
