<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログアプリ</title>
</head>
<body>

<h2>稼働ログ</h2>

<button onclick="startWork()">出勤</button>
<button onclick="startBreak()">休憩</button>
<button onclick="resumeWork()">再開</button>
<button onclick="endWork()">退勤</button>

<script>
let status="OFF";
let logs=[];

function getLocation(){
 return new Promise((resolve)=>{
  navigator.geolocation.getCurrentPosition(pos=>{
   resolve({
    lat:pos.coords.latitude,
    lng:pos.coords.longitude
   });
  });
 });
}

async function addLog(){
 const loc=await getLocation();
 logs.push({
  time:new Date().toISOString(),
  status,
  lat:loc.lat,
  lng:loc.lng
 });
}

function startWork(){
 status="ON";
 addLog();
}

function startBreak(){
 status="BREAK";
 addLog();
}

function resumeWork(){
 status="ON";
 addLog();
}

async function endWork(){
 status="OFF";
 await addLog();

 await fetch("https://fragrant-dew-8296.info-chibafukushi.workers.dev",{
  method:"POST",
  headers:{
   "Content-Type":"application/json"
  },
  body:JSON.stringify(logs)
 });

 alert("クラウド保存完了");
 logs=[];
}
</script>

</body>
</html>
