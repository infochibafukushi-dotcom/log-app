<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログアプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    button {
      font-size: 18px;
      margin: 8px;
      padding: 12px 20px;
      width: 80%;
      max-width: 300px;
    }
    .status {
      font-size: 20px;
      margin: 15px;
    }
    .result {
      margin-top: 20px;
      font-size: 16px;
      text-align: left;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>稼働ログアプリ</h2>

  <div class="status">状態：<span id="status">OFF</span></div>

  <button onclick="startWork()">出勤</button>
  <button onclick="startBreak()">休憩開始</button>
  <button onclick="resumeWork()">業務再開</button>
  <button onclick="endWork()">退勤</button>

  <hr>

  <button onclick="openLatestLocation()">現在地を地図で開く</button>
  <button onclick="clearLogs()">ログ削除</button>

  <div class="result" id="result"></div>

<script>
let status = "OFF";
let intervalId = null;

function updateStatus() {
  document.getElementById("status").innerText = status;
}

function saveLog(lat = null, lng = null) {
  const logs = JSON.parse(localStorage.getItem("logs") || "[]");

  logs.push({
    time: new Date().toISOString(),
    status: status,
    lat: lat,
    lng: lng
  });

  localStorage.setItem("logs", JSON.stringify(logs));
}

function getLocationAndSave() {
  navigator.geolocation.getCurrentPosition(pos => {
    saveLog(pos.coords.latitude, pos.coords.longitude);
  }, () => {
    saveLog();
  });
}

function startGPS() {
  if (intervalId) return;
  intervalId = setInterval(getLocationAndSave, 60000);
}

function stopGPS() {
  clearInterval(intervalId);
  intervalId = null;
}

function startWork() {
  status = "ON";
  updateStatus();
  getLocationAndSave();
  startGPS();
}

function startBreak() {
  status = "BREAK";
  updateStatus();
  getLocationAndSave();
}

function resumeWork() {
  status = "ON";
  updateStatus();
  getLocationAndSave();
}

function endWork() {
  status = "OFF";
  updateStatus();
  getLocationAndSave();
  stopGPS();
  showLogs();
}

function showLogs() {
  const logs = JSON.parse(localStorage.getItem("logs") || "[]");
  document.getElementById("result").innerText = JSON.stringify(logs, null, 2);
}

function clearLogs() {
  localStorage.removeItem("logs");
  document.getElementById("result").innerText = "ログ削除しました";
}

function openLatestLocation() {
  const logs = JSON.parse(localStorage.getItem("logs") || "[]");

  if (logs.length === 0) {
    alert("ログがありません");
    return;
  }

  const latest = logs[logs.length - 1];

  if (!latest.lat || !latest.lng) {
    alert("位置情報がありません");
    return;
  }

  const url = `https://www.google.com/maps?q=${latest.lat},${latest.lng}`;
  window.open(url, "_blank");
}

updateStatus();
</script>

</body>
</html>
