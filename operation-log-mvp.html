<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>運行ログ MVP</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --danger: #dc2626;
      --warning: #d97706;
      --success: #16a34a;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 14px 32px;
    }
    header {
      padding: 10px 4px 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin: 12px 0;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .status-label {
      font-size: 13px;
      color: var(--muted);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      background: #eef2ff;
      color: #3730a3;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--primary);
    }
    .status-off { background: #f3f4f6; color: #374151; }
    .status-off .dot { background: #6b7280; }
    .status-on { background: #ecfdf5; color: #065f46; }
    .status-on .dot { background: var(--success); }
    .status-break { background: #fffbeb; color: #92400e; }
    .status-break .dot { background: var(--warning); }
    .timer {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin: 14px 0 2px;
    }
    .timer-caption {
      color: var(--muted);
      font-size: 13px;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 10px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      min-height: 54px;
    }
    button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    .btn-start { background: var(--success); }
    .btn-break { background: var(--warning); }
    .btn-resume { background: var(--primary); }
    .btn-end { background: var(--danger); }
    .btn-secondary {
      background: #111827;
    }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fafafa;
    }
    .metric .name {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .metric .value {
      font-size: 20px;
      font-weight: 800;
    }
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }
    .log-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      background: #fff;
    }
    .log-main {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .log-sub {
      color: var(--muted);
      line-height: 1.4;
      word-break: break-all;
    }
    .notice {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .danger-text { color: var(--danger); }
    .small-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .small-actions button {
      font-size: 14px;
      min-height: 44px;
      padding: 10px;
      background: #374151;
    }
    @media (max-width: 360px) {
      .buttons, .grid2, .small-actions { grid-template-columns: 1fr; }
      .timer { font-size: 30px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>運行ログ MVP</h1>
      <div class="sub">出勤・休憩・再開・退勤を記録し、スマホGPSログを端末内に保存します。</div>
    </header>

    <section class="card">
      <div class="status-row">
        <div>
          <div class="status-label">現在の状態</div>
          <div id="lastUpdated" class="notice">未記録</div>
        </div>
        <div id="statusBadge" class="status-badge status-off"><span class="dot"></span><span>OFF</span></div>
      </div>
      <div id="elapsed" class="timer">00:00:00</div>
      <div class="timer-caption">出勤からの経過時間</div>
      <div class="buttons">
        <button id="btnStart" class="btn-start">出勤</button>
        <button id="btnBreak" class="btn-break">休憩開始</button>
        <button id="btnResume" class="btn-resume">業務再開</button>
        <button id="btnEnd" class="btn-end">退勤</button>
      </div>
    </section>

    <section class="card">
      <h2 style="font-size:18px;margin:0 0 12px;">本日の集計</h2>
      <div class="grid2">
        <div class="metric"><div class="name">総拘束時間</div><div id="totalTime" class="value">00:00</div></div>
        <div class="metric"><div class="name">業務時間</div><div id="workTime" class="value">00:00</div></div>
        <div class="metric"><div class="name">休憩時間</div><div id="breakTime" class="value">00:00</div></div>
        <div class="metric"><div class="name">GPSログ数</div><div id="logCount" class="value">0</div></div>
      </div>
      <div class="small-actions">
        <button id="btnExport">JSON出力</button>
        <button id="btnReset">本日のログ削除</button>
      </div>
      <p class="notice">※このMVPでは移動時間・待機時間の自動判定はまだ入れていません。まずGPSログ保存までの最小版です。</p>
    </section>

    <section class="card">
      <h2 style="font-size:18px;margin:0 0 12px;">最新ログ</h2>
      <div id="logList" class="log-list"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "operation_log_mvp_v1";
    const GPS_INTERVAL_MS = 60 * 1000;

    const STATE = {
      OFF: "OFF",
      ON: "ON",
      BREAK: "BREAK"
    };

    const els = {
      statusBadge: document.getElementById("statusBadge"),
      lastUpdated: document.getElementById("lastUpdated"),
      elapsed: document.getElementById("elapsed"),
      totalTime: document.getElementById("totalTime"),
      workTime: document.getElementById("workTime"),
      breakTime: document.getElementById("breakTime"),
      logCount: document.getElementById("logCount"),
      logList: document.getElementById("logList"),
      btnStart: document.getElementById("btnStart"),
      btnBreak: document.getElementById("btnBreak"),
      btnResume: document.getElementById("btnResume"),
      btnEnd: document.getElementById("btnEnd"),
      btnExport: document.getElementById("btnExport"),
      btnReset: document.getElementById("btnReset")
    };

    let gpsTimer = null;
    let uiTimer = null;

    function nowIso() {
      return new Date().toISOString();
    }

    function todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatDateTime(iso) {
      if (!iso) return "未記録";
      const d = new Date(iso);
      return d.toLocaleString("ja-JP", { hour12: false });
    }

    function formatDuration(ms, includeSeconds = false) {
      const safeMs = Math.max(0, ms || 0);
      const totalSeconds = Math.floor(safeMs / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (includeSeconds) {
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }
      return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return {
          date: todayKey(),
          state: STATE.OFF,
          startedAt: null,
          endedAt: null,
          lastChangedAt: null,
          events: [],
          gpsLogs: []
        };
      }
      try {
        const data = JSON.parse(raw);
        if (data.date !== todayKey()) {
          return {
            date: todayKey(),
            state: STATE.OFF,
            startedAt: null,
            endedAt: null,
            lastChangedAt: null,
            events: [],
            gpsLogs: []
          };
        }
        return data;
      } catch (e) {
        return {
          date: todayKey(),
          state: STATE.OFF,
          startedAt: null,
          endedAt: null,
          lastChangedAt: null,
          events: [],
          gpsLogs: []
        };
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function addEvent(type, state, note) {
      const data = loadData();
      const event = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
        type,
        state,
        note: note || "",
        time: nowIso()
      };
      data.events.push(event);
      data.state = state;
      data.lastChangedAt = event.time;
      if (type === "START") {
        data.startedAt = event.time;
        data.endedAt = null;
      }
      if (type === "END") {
        data.endedAt = event.time;
      }
      saveData(data);
      captureGps(`EVENT_${type}`);
      updateGpsTimer();
      render();
    }

    function getCurrentPositionPromise() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("このブラウザはGPS取得に対応していません。"));
          return;
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 30000
        });
      });
    }

    async function captureGps(reason) {
      const data = loadData();
      if (data.state === STATE.OFF && reason !== "EVENT_END") return;
      try {
        const pos = await getCurrentPositionPromise();
        const latest = loadData();
        latest.gpsLogs.push({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
          time: nowIso(),
          state: latest.state,
          reason: reason || "INTERVAL",
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          speed: pos.coords.speed,
          heading: pos.coords.heading
        });
        saveData(latest);
        render();
      } catch (error) {
        const latest = loadData();
        latest.gpsLogs.push({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
          time: nowIso(),
          state: latest.state,
          reason: reason || "INTERVAL",
          error: error.message || "GPS取得に失敗しました"
        });
        saveData(latest);
        render();
      }
    }

    function updateGpsTimer() {
      const data = loadData();
      if (gpsTimer) {
        clearInterval(gpsTimer);
        gpsTimer = null;
      }
      if (data.state === STATE.ON || data.state === STATE.BREAK) {
        gpsTimer = setInterval(() => captureGps("INTERVAL"), GPS_INTERVAL_MS);
      }
    }

    function calculateSummary(data) {
      const events = [...data.events].sort((a, b) => new Date(a.time) - new Date(b.time));
      if (!data.startedAt) {
        return { totalMs: 0, workMs: 0, breakMs: 0 };
      }
      const endTime = data.endedAt ? new Date(data.endedAt) : new Date();
      const startTime = new Date(data.startedAt);
      let workMs = 0;
      let breakMs = 0;

      for (let i = 0; i < events.length; i++) {
        const current = events[i];
        const next = events[i + 1];
        const from = new Date(current.time);
        const to = next ? new Date(next.time) : endTime;
        const diff = Math.max(0, to - from);
        if (current.state === STATE.ON) workMs += diff;
        if (current.state === STATE.BREAK) breakMs += diff;
      }

      return {
        totalMs: Math.max(0, endTime - startTime),
        workMs,
        breakMs
      };
    }

    function setBadge(state) {
      let label = "OFF";
      let cls = "status-off";
      if (state === STATE.ON) {
        label = "業務中";
        cls = "status-on";
      } else if (state === STATE.BREAK) {
        label = "休憩中";
        cls = "status-break";
      }
      els.statusBadge.className = `status-badge ${cls}`;
      els.statusBadge.innerHTML = `<span class="dot"></span><span>${label}</span>`;
    }

    function renderLogs(data) {
      const combined = [
        ...data.events.map(x => ({ kind: "EVENT", ...x })),
        ...data.gpsLogs.map(x => ({ kind: "GPS", ...x }))
      ].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 30);

      if (combined.length === 0) {
        els.logList.innerHTML = `<div class="notice">ログはまだありません。</div>`;
        return;
      }

      els.logList.innerHTML = combined.map(item => {
        if (item.kind === "EVENT") {
          return `
            <div class="log-item">
              <div class="log-main"><span>${item.type}</span><span>${formatDateTime(item.time)}</span></div>
              <div class="log-sub">状態：${item.state}${item.note ? " / " + item.note : ""}</div>
            </div>
          `;
        }
        const detail = item.error
          ? `<span class="danger-text">${item.error}</span>`
          : `緯度:${Number(item.lat).toFixed(6)} / 経度:${Number(item.lng).toFixed(6)} / 精度:${Math.round(item.accuracy || 0)}m`;
        return `
          <div class="log-item">
            <div class="log-main"><span>GPS ${item.reason || ""}</span><span>${formatDateTime(item.time)}</span></div>
            <div class="log-sub">状態：${item.state} / ${detail}</div>
          </div>
        `;
      }).join("");
    }

    function render() {
      const data = loadData();
      const summary = calculateSummary(data);
      setBadge(data.state);
      els.lastUpdated.textContent = data.lastChangedAt ? `最終更新：${formatDateTime(data.lastChangedAt)}` : "未記録";
      els.elapsed.textContent = formatDuration(summary.totalMs, true);
      els.totalTime.textContent = formatDuration(summary.totalMs);
      els.workTime.textContent = formatDuration(summary.workMs);
      els.breakTime.textContent = formatDuration(summary.breakMs);
      els.logCount.textContent = String(data.gpsLogs.length);

      els.btnStart.disabled = data.state !== STATE.OFF || !!data.startedAt && !data.endedAt;
      els.btnBreak.disabled = data.state !== STATE.ON;
      els.btnResume.disabled = data.state !== STATE.BREAK;
      els.btnEnd.disabled = data.state === STATE.OFF || !data.startedAt;

      renderLogs(data);
    }

    function exportJson() {
      const data = loadData();
      const summary = calculateSummary(data);
      const payload = {
        ...data,
        summary: {
          totalMs: summary.totalMs,
          workMs: summary.workMs,
          breakMs: summary.breakMs,
          totalTime: formatDuration(summary.totalMs),
          workTime: formatDuration(summary.workMs),
          breakTime: formatDuration(summary.breakMs)
        }
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `operation-log-${todayKey()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function resetToday() {
      const ok = confirm("本日のログを削除します。よろしいですか？");
      if (!ok) return;
      localStorage.removeItem(STORAGE_KEY);
      updateGpsTimer();
      render();
    }

    els.btnStart.addEventListener("click", () => addEvent("START", STATE.ON, "出勤"));
    els.btnBreak.addEventListener("click", () => addEvent("BREAK_START", STATE.BREAK, "休憩開始"));
    els.btnResume.addEventListener("click", () => addEvent("RESUME", STATE.ON, "業務再開"));
    els.btnEnd.addEventListener("click", () => addEvent("END", STATE.OFF, "退勤"));
    els.btnExport.addEventListener("click", exportJson);
    els.btnReset.addEventListener("click", resetToday);

    uiTimer = setInterval(render, 1000);
    updateGpsTimer();
    render();
  </script>
</body>
</html>
