<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>タイムカード管理画面</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--main:#2563eb;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--danger:#dc2626}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:1180px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 20px rgba(15,23,42,.06);padding:18px;margin-bottom:14px}h1{margin:0 0 8px}.sub{color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:700}.tab.active{background:var(--main);color:#fff}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.box{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:12px}.label{font-size:12px;color:var(--muted)}.value{font-size:22px;font-weight:800;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left}th{background:#f9fafb}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}input,select{padding:11px;border:1px solid var(--line);border-radius:12px;font-size:15px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:var(--main);color:#fff}.danger{background:var(--danger)}.ok{background:var(--ok)}.hide{display:none}.scroll{overflow:auto}.small{font-size:12px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}table{font-size:12px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>タイムカード管理画面</h1>
    <div class="sub">月別集計・従業員別集計・給与計算・シフト管理・CSV出力</div>
    <div class="small" id="adminUrl"></div>
  </div>

  <div class="card controls">
    <div><div class="label">対象月</div><input type="month" id="month"></div>
    <button id="reload">再読み込み</button>
    <button id="csv">CSV出力</button>
  </div>

  <div class="card tabs">
    <button class="tab active" data-tab="summary">月別集計</button>
    <button class="tab" data-tab="users">従業員別</button>
    <button class="tab" data-tab="payroll">給与計算</button>
    <button class="tab" data-tab="shifts">シフト</button>
    <button class="tab" data-tab="logs">ログ一覧</button>
  </div>

  <section id="summary" class="card panel">
    <h2>月別集計</h2>
    <div class="grid">
      <div class="box"><div class="label">総稼働時間</div><div class="value" id="sumWork">0:00</div></div>
      <div class="box"><div class="label">総休憩時間</div><div class="value" id="sumBreak">0:00</div></div>
      <div class="box"><div class="label">出勤回数</div><div class="value" id="sumSessions">0</div></div>
      <div class="box"><div class="label">総距離</div><div class="value" id="sumDistance">0.00km</div></div>
      <div class="box"><div class="label">総売上</div><div class="value" id="sumSales">0円</div></div>
    </div>
    <h3>日別集計</h3><div class="scroll"><table><thead><tr><th>日付</th><th>稼働</th><th>休憩</th><th>出勤回数</th><th>距離</th><th>売上</th></tr></thead><tbody id="dailyBody"></tbody></table></div>
  </section>

  <section id="users" class="card panel hide">
    <h2>従業員別集計</h2><div class="scroll"><table><thead><tr><th>ID</th><th>従業員名</th><th>稼働</th><th>休憩</th><th>出勤回数</th><th>距離</th><th>売上</th></tr></thead><tbody id="userBody"></tbody></table></div>
  </section>

  <section id="payroll" class="card panel hide">
    <h2>給与計算（歩合）</h2><p class="small">給与 = 売上 × 歩合率</p><div class="scroll"><table><thead><tr><th>ID</th><th>従業員名</th><th>売上</th><th>歩合率</th><th>給与</th></tr></thead><tbody id="payrollBody"></tbody></table></div>
  </section>

  <section id="shifts" class="card panel hide">
    <h2>シフト管理</h2>
    <div class="controls">
      <div><div class="label">従業員ID</div><input id="shiftUserId" value="0000"></div>
      <div><div class="label">従業員名</div><input id="shiftUserName" value="山本信勝"></div>
      <div><div class="label">日付</div><input type="date" id="shiftDate"></div>
      <div><div class="label">開始</div><input type="time" id="shiftStart"></div>
      <div><div class="label">終了</div><input type="time" id="shiftEnd"></div>
      <button class="ok" id="saveShift">保存</button>
    </div>
    <h3>シフト一覧</h3><div class="scroll"><table><thead><tr><th>日付</th><th>ID</th><th>従業員名</th><th>開始</th><th>終了</th><th>削除</th></tr></thead><tbody id="shiftBody"></tbody></table></div>
  </section>

  <section id="logs" class="card panel hide">
    <h2>ログ一覧</h2><div class="scroll"><table><thead><tr><th>日時</th><th>ID</th><th>従業員</th><th>状態</th><th>GPS</th><th>距離</th><th>session</th></tr></thead><tbody id="logBody"></tbody></table></div>
  </section>
</div>
<script>
const API_BASE = "https://YOUR-WORKER-DOMAIN.workers.dev";
const ADMIN_ACCESS_URL = "https://YOUR-WORKER-DOMAIN.workers.dev/admin";
const $ = id => document.getElementById(id);
const PAY_RATE = { "0000": 0.6 };
let cache = {summary:null, users:[], payroll:[], logs:[], shifts:[]};
function ym(){return $("month").value}
function pad(n){return String(n).padStart(2,"0")}
function fmtDur(sec){sec=Math.max(0,Math.floor(sec||0)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60); return `${h}:${pad(m)}`}
function yen(n){return Math.round(n||0).toLocaleString()+"円"}
function km(n){return Number(n||0).toFixed(2)+"km"}
function todayMonth(){const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function todayDate(){const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function csvEscape(v){return `"${String(v??"").replaceAll('"','""')}"`}
async function api(path, opt={}){ const res=await fetch(API_BASE+path,opt); if(!res.ok) throw new Error(await res.text()); return res.json(); }
async function loadAll(){ const month=ym(); const [summary, users, logs, shifts] = await Promise.all([api(`/report?month=${month}`), api(`/report-by-user?month=${month}`), api(`/logs?month=${month}`), api(`/shifts?month=${month}`)]); cache.summary=summary; cache.users=users.users||[]; cache.logs=logs.logs||[]; cache.shifts=shifts.shifts||[]; cache.payroll=cache.users.map(u=>({...u,pay_rate:PAY_RATE[u.user_id]??0.6,salary:(u.sales||0)*(PAY_RATE[u.user_id]??0.6)})); renderAll(); }
function renderAll(){ const s=cache.summary||{}; $("sumWork").textContent=fmtDur(s.total_work_seconds); $("sumBreak").textContent=fmtDur(s.total_break_seconds); $("sumSessions").textContent=s.total_sessions||0; $("sumDistance").textContent=km(s.total_distance); $("sumSales").textContent=yen(s.total_sales); $("dailyBody").innerHTML=(s.daily||[]).map(d=>`<tr><td>${d.date}</td><td>${fmtDur(d.work_seconds)}</td><td>${fmtDur(d.break_seconds)}</td><td>${d.sessions}</td><td>${km(d.distance)}</td><td>${yen(d.sales)}</td></tr>`).join(""); $("userBody").innerHTML=cache.users.map(u=>`<tr><td>${u.user_id}</td><td>${u.user_name}</td><td>${fmtDur(u.work_seconds)}</td><td>${fmtDur(u.break_seconds)}</td><td>${u.sessions}</td><td>${km(u.distance)}</td><td>${yen(u.sales)}</td></tr>`).join(""); $("payrollBody").innerHTML=cache.payroll.map(u=>`<tr><td>${u.user_id}</td><td>${u.user_name}</td><td>${yen(u.sales)}</td><td>${Math.round(u.pay_rate*100)}%</td><td>${yen(u.salary)}</td></tr>`).join(""); $("logBody").innerHTML=cache.logs.map(l=>`<tr><td>${new Date(l.time).toLocaleString()}</td><td>${l.user_id||""}</td><td>${l.user_name||""}</td><td>${l.status}</td><td>${l.lat?Number(l.lat).toFixed(6)+","+Number(l.lng).toFixed(6):""}</td><td>${km(l.distance)}</td><td>${l.session_id}</td></tr>`).join(""); renderShifts(); }
function renderShifts(){ $("shiftBody").innerHTML=cache.shifts.map(s=>`<tr><td>${s.date}</td><td>${s.user_id}</td><td>${s.user_name||""}</td><td>${s.start_time}</td><td>${s.end_time}</td><td><button class="danger" onclick="deleteShift(${s.id})">削除</button></td></tr>`).join(""); }
async function saveShift(){ const body={user_id:$("shiftUserId").value.trim(),user_name:$("shiftUserName").value.trim(),date:$("shiftDate").value,start_time:$("shiftStart").value,end_time:$("shiftEnd").value}; await api("/shifts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); await loadAll(); }
async function deleteShift(id){ await api(`/shifts/${id}`,{method:"DELETE"}); await loadAll(); }
function exportCsv(){ const rows=[["種別","日付","ID","従業員名","稼働","休憩","出勤回数","距離","売上","歩合率","給与"]]; (cache.summary?.daily||[]).forEach(d=>rows.push(["日別",d.date,"","",fmtDur(d.work_seconds),fmtDur(d.break_seconds),d.sessions,km(d.distance),Math.round(d.sales||0),"",""])); cache.payroll.forEach(u=>rows.push(["従業員別","",u.user_id,u.user_name,fmtDur(u.work_seconds),fmtDur(u.break_seconds),u.sessions,km(u.distance),Math.round(u.sales||0),Math.round(u.pay_rate*100)+"%",Math.round(u.salary)])); const csv=rows.map(r=>r.map(csvEscape).join(",")).join("\n"); const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`timecard_${ym()}.csv`; a.click(); URL.revokeObjectURL(a.href); }
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");document.querySelectorAll(".panel").forEach(p=>p.classList.add("hide"));$(btn.dataset.tab).classList.remove("hide");});
$("reload").onclick=loadAll; $("csv").onclick=exportCsv; $("saveShift").onclick=saveShift; $("month").value=todayMonth(); $("shiftDate").value=todayDate(); $("adminUrl").textContent="推奨管理URL："+ADMIN_ACCESS_URL; loadAll().catch(e=>alert("読み込み失敗："+e.message));
</script>
</body>
</html>
